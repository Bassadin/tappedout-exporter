name: Release and publish GHCR image

on:
    push:
        branches:
            - main

permissions:
    contents: write
    issues: write
    pull-requests: write
    packages: write
    attestations: write
    id-token: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    release_please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
            version: ${{ steps.release.outputs.version }}
            major: ${{ steps.release.outputs.major }}
            minor: ${{ steps.release.outputs.minor }}
            sha: ${{ steps.release.outputs.sha }}
        steps:
            - name: Create or update release pull request
              id: release
              uses: googleapis/release-please-action@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    publish-image:
        needs: release_please
        if: ${{ needs.release_please.outputs.release_created == 'true' }}
        runs-on: ubuntu-latest
        steps:
            - name: Check out release tag
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.release_please.outputs.tag_name }}

            - name: Set up Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: 2.9.4
                  cache: true

            - name: Verify release version
              env:
                  TAG: ${{ needs.release_please.outputs.tag_name }}
              run: |
                  VERSION="$(deno eval --print "JSON.parse(Deno.readTextFileSync('deno.json')).version")"
                  test "$TAG" = "v$VERSION" || {
                    echo "Tag $TAG does not match deno.json version $VERSION" >&2
                    exit 1
                  }

            - name: Verify locked dependencies
              run: deno ci

            - name: Run checks before publishing
              run: deno task check

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate image metadata
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  flavor: |
                      latest=false
                  tags: |
                      type=raw,value=${{ needs.release_please.outputs.version }}
                      type=raw,value=${{ needs.release_please.outputs.major }}.${{ needs.release_please.outputs.minor }}
                      type=raw,value=${{ needs.release_please.outputs.major }}
                      type=raw,value=latest
                      type=raw,value=sha-${{ needs.release_please.outputs.sha }}

            - name: Build and push Docker image
              id: push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Attest image provenance
              uses: actions/attest@v4
              with:
                  subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  subject-digest: ${{ steps.push.outputs.digest }}
                  push-to-registry: true
